<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>DACS Cost Explorer</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
/* Layout: glass sidebar + main column, sticky scenario bar on top of every view, cards on a topographic ground.
   Identity taken from the DACS Logo Desk (liquid glass, navy/sky, dark by default). */
:root{
  --bg:#0C1330; --bg-2:#101A3F; --ink:#EEF3FB; --ink-2:#B8C3D9; --ink-3:#8793AE;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.15);
  --glass:rgba(28,40,82,.56); --glass-2:rgba(34,48,96,.82); --glass-3:rgba(28,40,82,.34);
  --edge:rgba(255,255,255,.14); --hi:rgba(255,255,255,.16); --lo:rgba(0,0,0,.25);
  --shadow:0 1px 2px rgba(0,0,0,.2),0 12px 36px rgba(0,0,0,.35);
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.12);
  --accent:#7CC4F0; --accent-ink:#0C1330; --accent-tint:rgba(124,196,240,.16);
  --good:#6FD39A; --good-t:rgba(111,211,154,.15); --warn:#F0C06A; --warn-t:rgba(240,192,106,.15); --bad:#F2998F; --bad-t:rgba(242,153,143,.15);
  --c1:#6272E6; --c2:#1A9DB5; --c3:#56A23A; --target:#F0C06A;
  --gloss:.16; --topo-op:.06; --photo-op:.30;
  --topo:url("assets/img/topo-lines-white.webp");
  --logo-decade:url("assets/img/decade-logo-white.webp"); --logo-unesco:url("assets/img/unesco-logo-white.webp");
  --blur:26px; --r-xl:28px; --r-l:22px; --r-m:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF4FA; --bg-2:#DCEAF5; --ink:#121C38; --ink-2:#46526E; --ink-3:#6E7890;
  --line:rgba(35,49,95,.10); --line-2:rgba(35,49,95,.18);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.86); --glass-3:rgba(255,255,255,.42);
  --edge:rgba(255,255,255,.75); --hi:rgba(255,255,255,.95); --lo:rgba(35,49,95,.06);
  --shadow:0 1px 2px rgba(18,28,56,.05),0 10px 34px rgba(18,28,56,.09);
  --fill:rgba(35,49,95,.06); --fill-2:rgba(35,49,95,.11);
  --accent:#1F6FB8; --accent-ink:#fff; --accent-tint:rgba(31,111,184,.12);
  --good:#1D7F46; --good-t:rgba(29,127,70,.12); --warn:#A0660A; --warn-t:rgba(214,146,26,.16); --bad:#B53A2E; --bad-t:rgba(181,58,46,.12);
  --c1:#2A5CAA; --c2:#0A9CC0; --c3:#5BA83A; --target:#A0660A;
  --gloss:.7; --topo-op:.075; --photo-op:0;
  --topo:url("assets/img/topo-lines-navy.webp");
  --logo-decade:url("assets/img/decade-logo-color.webp"); --logo-unesco:url("assets/img/unesco-logo-color.webp");
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:
  radial-gradient(60% 50% at 8% 0%,rgba(142,210,238,.40),transparent 70%),
  radial-gradient(45% 45% at 100% 12%,rgba(31,111,184,.18),transparent 70%),
  radial-gradient(55% 60% at 70% 100%,rgba(10,156,192,.16),transparent 70%),
  linear-gradient(180deg,var(--bg),var(--bg-2))}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--topo) 55% 30%/1500px auto no-repeat;opacity:var(--topo-op)}
.photo{position:fixed;inset:0;z-index:-2;pointer-events:none;background:url("assets/img/ice-cave.webp") center/cover;opacity:var(--photo-op);filter:saturate(1.1)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(175%);backdrop-filter:blur(var(--blur)) saturate(175%);
  border:1px solid var(--edge);border-radius:var(--r-l);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12));opacity:var(--gloss)}
.glass>*{position:relative}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);gap:28px;padding:22px 28px 56px;max-width:1560px;margin:0 auto}
.side{position:sticky;top:18px;align-self:start;height:calc(100vh - 36px);display:flex;flex-direction:column;padding:18px 14px;border-radius:var(--r-xl)}
.brand{display:flex;flex-direction:column;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line)}
.lockup{display:flex;align-items:center;gap:10px}
.logo-decade{height:40px;width:118px;flex:none;background:var(--logo-decade) left center/contain no-repeat}
.lockup i{width:1px;height:32px;background:var(--line-2);flex:none}
.logo-unesco{height:24px;width:78px;flex:none;background:var(--logo-unesco) left center/contain no-repeat}
.brand-name{font-size:13px;color:var(--ink-2);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:9px 10px;border-radius:12px;font-size:14.5px;font-weight:560;color:var(--ink-2);cursor:pointer;text-align:left}
.nav button svg{width:20px;height:20px;flex:none;opacity:.85}
.nav button:hover{background:var(--fill)}
.nav button[aria-current="page"]{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),0 2px 10px rgba(18,28,56,.08)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}

main{min-width:0;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:6px 4px 0}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.title{font-size:34px;font-weight:720;line-height:1.08;margin-top:4px}
.sub{color:var(--ink-2);margin-top:6px;max-width:72ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:620;cursor:pointer;background:var(--fill);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--fill);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:620;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-width:38px}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--ink);box-shadow:0 1px 3px rgba(18,28,56,.14),inset 0 1px 0 var(--hi)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:620;white-space:nowrap;background:var(--fill);color:var(--ink-2)}
.pill svg{width:13px;height:13px}
.t-good{background:var(--good-t);color:var(--good)} .t-warn{background:var(--warn-t);color:var(--warn)} .t-bad{background:var(--bad-t);color:var(--bad)} .t-info{background:var(--accent-tint);color:var(--accent)}
.muted{color:var(--ink-3)}

/* scenario bar */
.scen{position:sticky;top:10px;z-index:20;padding:14px 18px;border-radius:var(--r-l);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:center}
.scen-ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.scen-ctl .grp{display:flex;align-items:center;gap:8px}
.scen-ctl .grp>span{font-size:12.5px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.scen-total{text-align:right}
.scen-total b{display:block;font-size:24px;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.scen-total span{font-size:12.5px;color:var(--ink-3)}
.presets{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.presets>span{font-size:12px;color:var(--ink-3);font-weight:600}

.card{padding:24px 26px}
.card h2{font-size:18px;font-weight:680}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head p{font-size:13.5px;color:var(--ink-3);margin-top:3px;max-width:70ch}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}

.stat{padding:20px 22px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .l{font-size:13px;font-weight:600;color:var(--ink-2)}
.stat .v{font-size:26px;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:4px}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.bar{height:8px;border-radius:99px;background:var(--fill-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-2);font-size:12px;font-family:var(--font)}
.chart .axis text{fill:var(--ink-3);font-size:11.5px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .lbl-strong{fill:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.chart rect.hit{fill:transparent;cursor:default}
.chart .seg-r{transition:opacity .15s}
.chart:hover .seg-r.dim{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dash{width:14px;height:0;border-top:2px dashed var(--target)}
#tip{position:fixed;z-index:80;pointer-events:none;padding:10px 12px;border-radius:12px;background:var(--glass-2);border:1px solid var(--edge);box-shadow:var(--shadow);font-size:12.5px;line-height:1.45;color:var(--ink);max-width:280px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#tip b{font-variant-numeric:tabular-nums}
#tip .tr{display:flex;justify-content:space-between;gap:14px;align-items:center}
#tip .tr span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}

.rank{display:flex;flex-direction:column;gap:10px}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13.5px}
.rank .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r b{font-variant-numeric:tabular-nums;font-weight:650}
.rank .r .track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--fill)}
.rank .r .track i{display:block;height:100%;border-radius:99px}

/* tables */
.table-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:650;color:var(--ink-3);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;letter-spacing:.02em}
th:first-child,td:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:right;font-variant-numeric:tabular-nums}
td:first-child{min-width:230px;font-weight:560;line-height:1.3}
td .o{display:block;font-size:12px;color:var(--ink-3);font-weight:450;margin-top:2px}
tr.sum td{font-weight:700;border-bottom:0;border-top:1px solid var(--line-2)}
th.on,td.on{background:var(--accent-tint)}
th.on{color:var(--accent)}
.cell-in{width:100%;min-width:64px;max-width:120px;border:1px solid var(--line-2);background:var(--glass-3);border-radius:9px;padding:5px 8px;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.cell-in.qty{max-width:74px}
.cell-in.wide{max-width:150px}
.cell-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.cell-in.mod{border-color:var(--warn);background:var(--warn-t)}
.derived{color:var(--ink-3);font-size:12.5px}
.linked{font-size:11px;font-weight:650;color:var(--accent);margin-left:6px;white-space:nowrap}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center}
.kv label{font-size:14px;font-weight:560}
.kv label small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:450}
.note{padding:12px 14px;border-radius:14px;background:var(--accent-tint);font-size:13.5px;color:var(--ink);line-height:1.5}
.note.warn{background:var(--warn-t)}
.gauge{display:flex;flex-direction:column;gap:8px}
.gauge .track{position:relative;height:14px;border-radius:99px;background:var(--fill-2)}
.gauge .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c1)}
.gauge .track em{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--target)}
.gauge .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.matrix td,.matrix th{text-align:left;vertical-align:top;white-space:normal}
.matrix td{font-variant-numeric:normal;min-width:150px;font-size:13px;color:var(--ink-2)}
.matrix td:first-child{color:var(--ink);min-width:190px}
.yes{color:var(--good);font-weight:650} .maybe{color:var(--warn);font-weight:650} .no{color:var(--bad);font-weight:650}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:560;background:var(--glass-2);border:1px solid var(--edge);box-shadow:var(--shadow);color:var(--ink)}
.tabbar{display:none}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:22px}
  .topbar .logo-decade{height:34px;width:100px}.topbar .logo-unesco{height:22px;width:70px}.topbar .lockup i{height:26px}
  .tabbar{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;padding:6px;border-radius:999px;gap:2px;width:max-content;max-width:calc(100% - 24px);overflow-x:auto}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{background:var(--glass-2);color:var(--accent)}
  .title{font-size:27px}
  .card{padding:20px 18px}
  .scen{grid-template-columns:minmax(0,1fr);position:relative;top:auto;padding:12px 14px}
  .scen-total{text-align:left}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}.stat .v{font-size:26px}.scen-ctl .grp{width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="photo" aria-hidden="true"></div>
<div class="app">
  <aside class="side glass" aria-label="Navigation">
    <div class="brand">
      <div class="lockup"><div class="logo-decade" role="img" aria-label="Decade of Action for Cryospheric Sciences 2025–2034"></div><i aria-hidden="true"></i><div class="logo-unesco" role="img" aria-label="UNESCO"></div></div>
      <span class="brand-name">Cost Explorer · Decade budget scenarios 2027–2034</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="row" style="justify-content:space-between"><span>Secretariat: UNESCO-IHP</span><button class="btn sm" id="themeBtn" type="button">Bright</button></div>
    </div>
  </aside>
  <main>
    <div class="topbar glass"><div class="lockup"><div class="logo-decade" role="img" aria-label="Decade of Action for Cryospheric Sciences 2025–2034"></div><i aria-hidden="true"></i><div class="logo-unesco" role="img" aria-label="UNESCO"></div></div><button class="btn sm" id="themeBtn2" type="button">Bright</button></div>
    <section class="scen glass" id="scen" aria-label="Scenario"></section>
    <div id="view" style="display:flex;flex-direction:column;gap:22px"></div>
  </main>
</div>
<nav class="tabbar glass" id="tabbar" aria-label="Sections"></nav>
<div id="tip" hidden></div>

<script>
/* ============================================================
   1. Source data — DACS_Cost_scenarios_2027-2034.xlsx
   ============================================================ */
const WORKBOOK = {
  params:{psc:0.07, nWG:5, first:2027, last:2034, target:1e9, envelopes:[1e7,2e7,3e7], basis:"unit", esc:0, ramp:1},
  // Assumptions §1 staff (annual unit cost, maximum cost)
  staff:{
    coord:{name:"Decade Coordinator (P-5)",unit:292032,max:514186},
    sci:{name:"Programme Specialist - Cryospheric scientist focal point (P-4)",unit:249388,max:439099},
    reg:{name:"Programme Specialist - regional coordination (P-4)",unit:249396,max:439099},
    fund:{name:"Programme Specialist - fundraising and partnerships (P-3)",unit:206652,max:363858},
    data:{name:"Associate Programme Specialist - data and platform (P-1/2)",unit:159960,max:281643},
    cap:{name:"Associate Programme Specialist - capacity building (P-1/2)",unit:159960,max:281643},
    comm:{name:"Associate Communication Officer (P-1/2)",unit:159960,max:281643},
    assoc:{name:"Associate Programme Specialist - Associate coordinator of the Decade (P-1/2)",unit:159960,max:281643},
    admin:{name:"Administrative support (G-5)",unit:95928,max:195628},
    consult:{name:"Consultant (11 months)",unit:45000,max:55000},
    wgsup:{name:"Working Group L/AL/S coordination support",unit:50000,max:55000}
  },
  // Assumptions §2 meeting and operating unit costs
  ops:{
    gov:{name:"Statutory governance meeting in person",unit:60000,why:"Travel support, interpretation, venue, meeting services and documentation (except ESC, as Member States are in Paris)"},
    virt:{name:"Virtual governance or coordination meeting",unit:10000,why:"Interpretation, platform support, moderation and meeting documentation"},
    town:{name:"Large online plenary or partner town hall",unit:12500,why:"Technical production, interpretation, moderation and participation support"},
    cfd:{name:"Cryosphere Finance Dialogue hybrid session",unit:60000,why:"Venue, travel support, communication, institutional participation and documentation"},
    joint:{name:"Joint annual governance meeting in person or hybrid",unit:100000,why:"Joint SMC, Working Group, Finance Dialogue and Alliance coordination session"},
    side:{name:"Side event at a major international event",unit:40000,why:"Event space, travel support, speaker preparation, interpretation, audiovisual services and outreach"},
    summit:{name:"Triennial Cryosphere Summit (per edition)",unit:1200000,why:"Venue, travel support, interpretation, security and event production"},
    wdg:{name:"World Day for Glaciers celebrations (per edition)",unit:150000,why:"Venue, travel support, interpretation, security and event production"},
    wgmeet:{name:"Working Group annual meeting in person (about 30 participants)",unit:60000,why:"Technical workshop, travel and knowledge-product preparation"},
    indig:{name:"Indigenous representative allowance to a Working Group",unit:30000,why:"Allowance support for participation in Working Group delivery"},
    travel:{name:"Travel support for developing-country and Indigenous members (per WG)",unit:50000,why:"Participation support across meetings, consultations and Working Group activities"},
    fellow:{name:"Early-career fellowship attached to a Working Group",unit:30000,why:"Fellowship support, mentoring and participation in Working Group delivery"},
    brief:{name:"Policy brief or decision-maker product",unit:30000,why:"Research, drafting, review, editing, design and digital publication"},

/* ============================================================
   3. Cost engine (pure) — reproduces the workbook formulas
   ============================================================ */
function staffUnit(m,key){ const s=m.staff[key]; return m.params.basis==="max" ? s.max : s.unit; }
function lineUnit(m,l){ if(l.staff) return staffUnit(m,l.staff); if(l.ref) return m.ops[l.ref].unit; return l.unit; }
function chains(m,i){ return m.coverage.groupings[i]*m.coverage.perGrouping[i]; }
function chainUnit(m){ return m.streams.reduce((a,s)=>a+s.unit,0); }
function prodUnit(m,l){ if(l.kind==="chains") return chainUnit(m); if(l.kind==="summit") return m.ops.summit.unit/3; return l.unit; }
function prodQty(m,l,i){ if(l.kind==="chains"||l.kind==="perChain") return chains(m,i); return l.q[i]; }

function compute(m){
  const R = {secStaff:[], secOps:[], wg:[], prod:[]};
  const lv=[0,1,2];
  R.secStaff = m.secStaff.map(l=>lv.map(i=>lineUnit(m,l)*l.q[i]));
  R.secOps   = m.secOps.map(l=>lv.map(i=>lineUnit(m,l)*l.q[i]));
  R.wg       = m.wg.map(l=>lv.map(i=>lineUnit(m,l)*l.q[i]));
  R.prod     = m.prod.map(l=>lv.map(i=>prodUnit(m,l)*prodQty(m,l,i)));
  const col = (rows,i)=>rows.reduce((a,r)=>a+r[i],0);
  R.staffSub = lv.map(i=>col(R.secStaff,i));
  R.opsSub   = lv.map(i=>col(R.secOps,i));
  R.sec      = lv.map(i=>R.staffSub[i]+R.opsSub[i]);   // USD/yr direct
  R.wgPer    = lv.map(i=>col(R.wg,i));
  R.wgAll    = lv.map(i=>R.wgPer[i]*m.params.nWG);       // USD/yr direct
  R.prodAll  = lv.map(i=>col(R.prod,i));                  // USD/yr direct
  return R;
}
function years(m){ const n=Math.max(1,Math.round(m.params.last-m.params.first+1)); return Array.from({length:n},(_,i)=>m.params.first+i); }
function yearFactor(m,i){ const p=m.params; const ramp=Math.max(1,p.ramp||1); return Math.pow(1+(p.esc||0),i)*Math.min(1,(i+1)/ramp); }
// Decade picture for a given mix of levels {sec,wg,prod}
function scenario(m,R,mix){
  const annual = {sec:R.sec[mix.sec], wg:R.wgAll[mix.wg], prod:R.prodAll[mix.prod]};
  const psc = 1+m.params.psc;
  const ys = years(m).map((y,i)=>{ const f=yearFactor(m,i)*psc; return {y, sec:annual.sec*f, wg:annual.wg*f, prod:annual.prod*f}; });
  const dec = {sec:0,wg:0,prod:0}; ys.forEach(r=>{dec.sec+=r.sec;dec.wg+=r.wg;dec.prod+=r.prod;});
  dec.total = dec.sec+dec.wg+dec.prod;
  const annualTotal = annual.sec+annual.wg+annual.prod;
  return {annual, annualTotal, ys, dec, envelope:m.params.envelopes[mix.sec]};
}

const fmt = n => Math.round(n).toLocaleString("en-US");
const fmtQ = n => (Math.round(n*100)/100).toLocaleString("en-US");
function fmtM(n,d=1){ const a=Math.abs(n); if(a>=1e9) return (n/1e9).toFixed(2)+" billion"; if(a>=1e6) return (n/1e6).toFixed(d)+" million"; if(a>=1e3) return Math.round(n/1e3).toLocaleString("en-US")+" thousand"; return fmt(n); }
function fmtS(n){ const a=Math.abs(n); if(a>=1e9) return (n/1e9).toFixed(2)+" bn"; if(a>=1e6) return (n/1e6).toFixed(a>=1e8?0:1)+" M"; if(a>=1e3) return Math.round(n/1e3)+" k"; return fmt(n); }
const pct = x => (x*100).toFixed(x<0.1?1:0)+"%";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*p; }
function ticks(max,count=5){ const step=niceMax(max/count); const out=[]; for(let v=0;v<=max+1e-6;v+=step) out.push(v); return out; }
function axisMax(v,count){ const step=niceMax(v/count); return Math.ceil(v/step)*step; }
function tipRows(rows,total){ return rows.map(r=>`<div class="tr"><span><i class="sw" style="background:var(${r.c})"></i>${esc(r.n)}</span><b>USD ${fmtM(r.v)}</b></div>`).join("")+(total!=null?`<div class="tr" style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px"><span>Total</span><b>USD ${fmtM(total)}</b></div>`:""); }

// A — Decade total by scenario: horizontal stacked bars + mobilisation target
function chartScenarios(el){
  const m=S.m, R=compute(m);
  const rows=[0,1,2].map(i=>({label:lvLabel(i), sub:["Targeted hotspots","Global coverage","Universal scaled delivery"][i], sc:scenario(m,R,{sec:i,wg:i,prod:i}), cur:false}));
  const pure = S.lv.sec===S.lv.wg && S.lv.wg===S.lv.prod;
  if(pure) rows[S.lv.sec].cur=true;
  else rows.push({label:"Your mix", sub:`S${S.lv.sec+1} · WG${S.lv.wg+1} · R${S.lv.prod+1}`, sc:scenario(m,R,S.lv), cur:true});
  const W=Math.max(320, el.clientWidth||720), padL=W<520?70:132, padR=W<520?64:84, top=26, rowH=W<520?40:46, barH=W<520?18:22;
  const H=top+rows.length*rowH+30;
  const target=m.params.target;
  const vmax=axisMax(Math.max(target,...rows.map(r=>r.sc.dec.total))*1.02,W<520?3:5);
  const x=v=>padL+(W-padL-padR)*v/vmax;
  const tk=ticks(vmax,W<520?3:5);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Decade total cost by scenario compared with the mobilisation target">`;
  s+=`<g class="axis">`+tk.map(v=>`<line class="grid-l" x1="${x(v)}" x2="${x(v)}" y1="${top-6}" y2="${H-24}"/><text x="${x(v)}" y="${H-8}" text-anchor="middle">${v===0?"0":fmtS(v)}</text>`).join("")+`</g>`;
  rows.forEach((r,ri)=>{
    const y=top+ri*rowH+(rowH-barH)/2;
    s+=`<text x="0" y="${y+barH/2-(W>=520?2:0)}" class="${r.cur?"lbl-strong":""}" dominant-baseline="middle" style="font-weight:${r.cur?700:600};fill:var(--ink)">${r.label}</text>`;
    if(W>=520) s+=`<text x="0" y="${y+barH/2+13}" dominant-baseline="middle" style="font-size:11px;fill:var(--ink-3)">${esc(r.sub)}</text>`;
    let acc=0; const parts=COMP.map(c=>({c:c.c,n:c.name,v:r.sc.dec[c.k]}));
    const tip=`<b>${r.label}</b> · ${esc(r.sub)}`+tipRows(parts,r.sc.dec.total)+`<div class="tr"><span>Share of target</span><b>${pct(r.sc.dec.total/target)}</b></div>`;
    parts.forEach((p,pi)=>{
      const x0=x(acc), x1=x(acc+p.v); acc+=p.v;
      const w=Math.max(0,x1-x0-(pi<2?2:0));
      if(w>0) s+=`<rect class="seg-r" x="${x0}" y="${y}" width="${w}" height="${barH}" rx="${pi===2||parts.slice(pi+1).every(q=>q.v===0)?4:1}" fill="var(${p.c})" opacity="${r.cur?1:.72}"/>`;
    });
    s+=`<text x="${x(acc)+8}" y="${y+barH/2}" dominant-baseline="middle" class="lbl-strong">${fmtS(r.sc.dec.total)}</text>`;
    if(r.cur) s+=`<rect x="${padL-6}" y="${y-5}" width="${x(acc)-padL+12}" height="${barH+10}" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
    s+=`<rect class="hit" x="0" y="${top+ri*rowH}" width="${W}" height="${rowH}" data-tip="${esc(tip)}"/>`;
  });
  s+=`<line x1="${x(target)}" x2="${x(target)}" y1="${top-14}" y2="${H-24}" stroke="var(--target)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<text x="${x(target)}" y="${top-17}" text-anchor="${x(target)>W-110?"end":"middle"}" style="fill:var(--target);font-weight:650;font-size:11.5px">Target ${fmtS(target)}</text>`;
  s+=`</svg>`;
  el.innerHTML=s;
}

  s+=`<g class="axis">`+ticks(vmax,4).map(v=>`<line class="grid-l" x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-8}" y="${y(v)}" text-anchor="end" dominant-baseline="middle">${v===0?"0":fmtS(v)}</text>`).join("")+`</g>`;
  ys.forEach((r,i)=>{

      const y0=y(acc), y1=y(acc+p.v); acc+=p.v;
      const h=Math.max(0,y0-y1-(pi>0?2:0));
      if(h>0) s+=`<rect class="seg-r" x="${cx-barW/2}" y="${y1}" width="${barW}" height="${h}" rx="${pi===2?4:1}" fill="var(${p.c})"/>`;
    });
    s+=`<text class="axis" x="${cx}" y="${H-8}" text-anchor="middle" style="fill:var(--ink-3);font-size:11.5px">${W<460?String(r.y).slice(2):r.y}</text>`;
    s+=`<rect class="hit" x="${cx-bw/2}" y="${top}" width="${bw}" height="${H-top-bot}" data-tip="${esc(`<b>${r.y}</b>`+tipRows(parts,acc))}"/>`;
  });
  s+=`</svg>`;
  el.innerHTML=s;
}

// Tooltip layer
const tip=document.getElementById("tip");
document.addEventListener("pointermove",e=>{
  const t=e.target.closest&&e.target.closest("[data-tip]");
  if(!t){ tip.hidden=true; return; }
  tip.innerHTML=t.dataset.tip; tip.hidden=false;
  const r=tip.getBoundingClientRect(); let x=e.clientX+14, y=e.clientY+14;
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-14; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14;
  tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,y)+"px";
});
document.addEventListener("pointerleave",()=>tip.hidden=true);

function head(eyebrow,title,sub,actions=""){
  return `<div class="head"><div><div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div><div class="row">${actions}</div></div>`;
}
const RESET_BTN = `<button class="btn sm" type="button" data-act="reset">Reset to workbook</button>`;
const isMod = p => { const a=getPath(S.m,p), b=getPath(WORKBOOK,p); return a!==b; };
function inp(path,{cls="",step=1,label=""}={}){
  const v=getPath(S.m,path);
  return `<input class="cell-in ${cls} ${isMod(path)?"mod":""}" type="number" min="0" step="${step}" inputmode="decimal" value="${v}" data-set="${path}" id="in-${path.replace(/\./g,'-')}" aria-label="${esc(label)}">`;
}
function refCount(key,kind){ const m=S.m; const lists=[m.secOps,m.wg,m.secStaff]; let n=0; lists.forEach(L=>L.forEach(l=>{ if((kind==="ops"&&l.ref===key)||(kind==="staff"&&l.staff===key)) n++; })); if(kind==="ops"&&key==="summit") n++; return n; }

function unitCell(listName,idx,l){
  const m=S.m;
  if(l.staff){ const f=m.params.basis==="max"?"max":"unit"; return inp(`staff.${l.staff}.${f}`,{cls:"wide",step:100,label:`${l.name} ${f==="max"?"maximum":"unit"} cost`})+(refCount(l.staff,"staff")>1?`<span class="linked" title="Shared with other lines">linked</span>`:""); }
  if(l.ref){ const shared=refCount(l.ref,"ops")>1; return inp(`ops.${l.ref}.unit`,{cls:"wide",step:500,label:`${l.name} unit cost`})+(shared?`<span class="linked" title="This unit cost from the Assumptions sheet is used by more than one line; changing it here changes all of them">linked</span>`:""); }
  return inp(`${listName}.${idx}.unit`,{cls:"wide",step:500,label:`${l.name} unit cost`});
}
function lineTable(listName,rows,costs,compKey,{sumLabel,sums,extraFoot=""}={}){
  const cur=S.lv[compKey];
  const th=[0,1,2].map(i=>`<th class="${i===cur?"on":""}">Qty L${i+1}</th>`).join("")+[0,1,2].map(i=>`<th class="${i===cur?"on":""}">L${i+1} (USD/yr)</th>`).join("");
  const body=rows.map((l,idx)=>`<tr><td>${esc(l.name)}${l.note?`<span class="o">${esc(l.note)}</span>`:""}</td><td>${unitCell(listName,idx,l)}</td>${[0,1,2].map(i=>`<td class="${i===cur?"on":""}">${inp(`${listName}.${idx}.q.${i}`,{cls:"qty",step:.25,label:`${l.name} quantity level ${i+1}`})}</td>`).join("")}${[0,1,2].map(i=>`<td class="${i===cur?"on":""}" data-out="${listName}.${idx}.${i}">${fmt(costs[idx][i])}</td>`).join("")}</tr>`).join("");
  const foot=sums?`<tr class="sum"><td>${sumLabel}</td><td></td><td class="${cur===0?"on":""}"></td><td class="${cur===1?"on":""}"></td><td class="${cur===2?"on":""}"></td>${[0,1,2].map(i=>`<td class="${i===cur?"on":""}" data-out="${listName}.sum.${i}">${fmt(sums[i])}</td>`).join("")}</tr>`:"";
  return `<div class="table-wrap"><table><thead><tr><th>Budget line</th><th>Unit cost (USD)</th>${th}</tr></thead><tbody>${body}${foot}${extraFoot}</tbody></table></div>`;
}

function viewOverview(R,sc){
  const m=S.m, p=m.params;

    `<button class="btn sm" type="button" data-act="copy">Copy summary</button>${RESET_BTN}`);
  const envOk = sc.dec.sec<=sc.envelope; const head_ = sc.envelope-sc.dec.sec;
  const tiles=`<div class="grid g4">
    <div class="glass stat"><span class="l">Annual direct cost</span><span class="v">USD ${fmtM(sc.annualTotal)}</span><span class="s">Per year at full level, before PSC</span></div>
    <div class="glass stat"><span class="l">Decade total, PSC included</span><span class="v">USD ${fmtM(sc.dec.total)}</span><span class="s">${years(m).length} years · PSC ${pct(p.psc)}</span></div>
    <div class="glass stat"><span class="l">Share of mobilisation target</span><span class="v">${pct(sc.dec.total/p.target)}</span><div class="bar"><i style="width:${Math.min(100,sc.dec.total/p.target*100)}%"></i></div><span class="s">Target USD ${fmtM(p.target,0)}</span></div>

  </div>`;
  const legend=`<div class="legend">${COMP.map(c=>`<span><i class="sw" style="background:var(${c.c})"></i>${c.name}</span>`).join("")}<span><i class="dash"></i>Mobilisation target</span></div>`;
  // Largest lines for the current mix (decade, PSC incl.)
  const mult = sc.ys.reduce((a,_,i)=>a+yearFactor(m,i),0)*(1+p.psc);
  const lines=[];
  m.secStaff.forEach((l,i)=>lines.push({n:l.name,c:"--c1",v:R.secStaff[i][S.lv.sec]*mult}));
  m.secOps.forEach((l,i)=>lines.push({n:l.name,c:"--c1",v:R.secOps[i][S.lv.sec]*mult}));
  m.wg.forEach((l,i)=>lines.push({n:l.name+" (all WGs)",c:"--c2",v:R.wg[i][S.lv.wg]*p.nWG*mult}));
  m.prod.forEach((l,i)=>lines.push({n:l.name,c:"--c3",v:R.prod[i][S.lv.prod]*mult}));
  lines.sort((a,b)=>b.v-a.v); const top=lines.slice(0,8); const tmax=top[0]?.v||1;
  const rank=`<div class="rank">${top.map(l=>`<div class="r"><span class="n" title="${esc(l.n)}">${esc(l.n)}</span><b>${fmtS(l.v)}</b><span class="track"><i style="width:${l.v/tmax*100}%;background:var(${l.c})"></i></span></div>`).join("")}</div>`;
  const shares=COMP.map(c=>`<div class="r"><span class="n"><i class="sw" style="display:inline-block;background:var(${c.c});margin-right:8px"></i>${c.name}</span><b>USD ${fmtM(sc.dec[c.k])} · ${pct(sc.dec[c.k]/sc.dec.total)}</b></div>`).join("");
  const levers = (p.esc||p.ramp>1)?`<div class="note warn">Exploration levers active: ${p.esc?`${(p.esc*100).toFixed(1)}% annual cost escalation`:""}${p.esc&&p.ramp>1?" and ":""}${p.ramp>1?`${p.ramp}-year ramp-up to full level`:""}. These are not part of the workbook. Set them back to zero in Assumptions to return to the workbook figures.</div>`:"";
  return head1+levers+tiles+`
  <div class="grid g3">
    <div class="glass card span2"><div class="card-head"><div><h2>Decade total by scenario</h2><p>Eight-year cost with PSC, by budget block. The outlined bar is your current selection. Hover a bar for the breakdown.</p></div></div>${legend}<div class="chart" id="chA"></div></div>
    <div class="glass card"><div class="card-head"><div><h2>Where the money goes</h2><p>Your selection, decade total with PSC.</p></div></div><div class="rank" style="margin-bottom:18px">${shares}</div><div class="eyebrow" style="margin-bottom:10px">Largest budget lines</div>${rank}</div>
  </div>
  <div class="glass card"><div class="card-head"><div><h2>Annual funding need, ${years(m)[0]}–${years(m).slice(-1)[0]}</h2><p>Your selection, per year with PSC. The workbook assumes the same amount every year; use the escalation and ramp-up levers in Assumptions to test other profiles.</p></div></div>${legend.replace(/<span><i class="dash"><\/i>Mobilisation target<\/span>/,"")}<div class="chart" id="chB"></div></div>`;
}

    ["OC1 Observation and interoperable data",["National monitoring infrastructure; co-financing; public data","Observation infrastructure; technical assistance","Risk-data requirements; underwriting data","Monitoring pilots; research grants","Observation networks; standards; scientific data"]],
    ["OC2 Modelling and actionable projections",["National modelling capacity; planning integration","Modelling platforms; technical assistance","Climate/catastrophe modelling requirements","Research and innovation","Models; scenarios; scientific expertise"]],
    ["OC3 Risk and exposure",["Risk assessments; early warning systems","Disaster-risk finance; risk assessment","Risk analytics; underwriting; risk transfer","Vulnerability / early-warning pilots","Hazard, exposure and vulnerability science"]],
    ["OC4 Adaptation and implementation",["NAP/NDC implementation; public investment","Adaptation finance; project preparation","Resilience incentives; risk transfer","Adaptation pilots","Technical/project support"]],
    ["OC5 Policy, education and uptake",["Policy adoption; public programmes","Capacity building","Risk literacy","Education; fellowships","Policy interface; training knowledge"]]
  ];
  const cats=[
    ["Direct DACS financing","Funding a DACS Working Group / Secretariat activity","Yes, considered a partner","Yes","Directly funds implementation of the Decade","yes"],
    ["DACS project financing","Funding an Overarching Challenge regional DACS project","Yes, considered a partner","Yes","Directly supports a defined DACS delivery activity","yes"],
    ["DACS-enabled project financing","Financing of adaptation projects that use DACS cryosphere risk assessment","Yes, if DACS role is demonstrable","Potentially","DACS science/data materially enabled project development or financing","maybe"],
    ["DACS technical contribution","DACS provides modelling, data or risk assessment to an external project","Yes, as DACS contribution","Not automatically the full project value","DACS contributes to the project but did not necessarily finance it","maybe"],
    ["In-kind scientific contribution","Contributing observations, data or expertise","Yes","Potentially, separately recorded","Supports DACS implementation","maybe"],
    ["DACS-aligned external investment","Climate-resilient projects with no DACS involvement","No","No, unless DACS role is established","Supports the same broad objective but cannot automatically be attributed to DACS","no"],
    ["General cryosphere research","Research project unrelated to DACS priorities","No","No","Cryosphere-related but outside the Decade's defined activities","no"],
    ["General adaptation finance","Adaptation financing with no cryosphere/DACS component","No","No","Adaptation finance alone does not constitute DACS financing","no"]
  ];
  return head("Convergence financing","Financing framework","Secretariat and Working Group funding make DACS fully operational. The wider aim is contributions from financial actors, through financing and through actions aligned with the Overarching Challenges.")+`
  <div class="glass card"><div class="card-head"><div><h2>What counts as a DACS contribution</h2><p>Decides what can be counted towards the USD ${fmtM(S.m.params.target,0)} mobilisation target.</p></div></div>
    <div class="table-wrap"><table class="matrix"><thead><tr><th>Contribution category</th><th>Example</th><th>DACS activity?</th><th>Counts towards mobilisation?</th><th>Reasoning</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td class="${c[5]}">${c[3]}</td><td>${c[4]}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="glass card"><div class="card-head"><div><h2>Contributions beyond direct financing, by actor</h2><p>How each type of actor can contribute to each Overarching Challenge.</p></div></div>
    <div class="table-wrap"><table class="matrix"><thead><tr><th>DACS OC</th>${actors.map(a=>`<th>${a}</th>`).join("")}</tr></thead><tbody>${mat.map(r=>`<tr><td>${r[0]}</td>${r[1].map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  <div class="note">The workbook's "Funding a DACS Global System" table (regional and global cost estimates per OC) is still marked TBC and holds no figures yet.</div>`;
}

/* ============================================================
   9. Render + live recalculation
   ============================================================ */
let R, SC;
function recalc(){ R=compute(S.m); SC=scenario(S.m,R,S.lv); }
function renderView(){
  recalc();
  const v=document.getElementById("view");
  const f={overview:viewOverview,sec:viewSec,wg:viewWG,prod:viewProd,assump:viewAssump,frame:viewFrame}[S.tab]||viewOverview;
  v.innerHTML=f(R,SC);
  drawCharts();
}
function drawCharts(){ const a=document.getElementById("chA"), b=document.getElementById("chB"); if(a) chartScenarios(a); if(b) chartYears(b,SC); }
function renderAll(){ recalc(); renderNav(); renderScen(R,SC); renderView(); }

// Live edits: update state, then refresh outputs without rebuilding inputs (keeps focus)
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-set]"); if(!el) return;
  let v=parseFloat(el.value); if(!isFinite(v)) return;
  if(v<0) v=0;
  const path=el.dataset.set;
  if(path==="params.ramp"||path==="params.nWG"||path.startsWith("params.first")||path.startsWith("params.last")) v=Math.round(v);
  if(path==="params.last" && v<S.m.params.first) return;
  if(path==="params.ramp" && v<1) v=1;
  setPath(S.m,path,v); save();
  document.querySelectorAll(`[data-set="${path}"]`).forEach(x=>{ x.classList.toggle("mod",isMod(path)); if(x!==el) x.value=v; });
  refresh();
});
// When a field loses focus, rebuild the view so labels and stats that depend on it catch up
document.addEventListener("change",e=>{
  if(!e.target.closest("[data-set]")) return;
  setTimeout(()=>{ // let focus move first, then rebuild and put focus back where the person is
    const a=document.activeElement, id=a&&a.id, y=scrollY;
    renderView(); scrollTo(0,y);
    const n=id&&document.getElementById(id); if(n){ n.focus({preventScroll:true}); try{ n.select(); }catch(_){} }
  },0);
});
function refresh(){
  recalc();
  renderScen(R,SC);
  const m=S.m, out={};
  ["secStaff","secOps","wg","prod"].forEach(k=>R[k].forEach((r,i)=>r.forEach((v,j)=>out[`${k}.${i}.${j}`]=fmt(v))));
  [0,1,2].forEach(i=>{ out[`secStaff.sum.${i}`]=fmt(R.staffSub[i]); out[`secOps.sum.${i}`]=fmt(R.opsSub[i]); out[`sec.tot.${i}`]=fmt(R.sec[i]); out[`wg.sum.${i}`]=fmt(R.wgPer[i]); out[`wg.all.${i}`]=fmt(R.wgAll[i]); out[`prod.sum.${i}`]=fmt(R.prodAll[i]); out[`chains.${i}`]=fmtQ(chains(m,i)); });
  out["chain.unit"]=fmt(chainUnit(m));
  m.prod.forEach((l,idx)=>{ out[`prod.unit.${idx}`]=fmt(prodUnit(m,l)); [0,1,2].forEach(i=>out[`prod.q.${idx}.${i}`]=fmtQ(prodQty(m,l,i))); });
  document.querySelectorAll("[data-out]").forEach(el=>{ const k=el.dataset.out; if(k in out) el.textContent=out[k]; });
  drawCharts();
}

// Theme toggle (Bright / Dark), as on the DACS platform
function currentTheme(){ return document.documentElement.dataset.theme==="light"?"light":"dark"; }
function applyThemeLabels(){ const t=currentTheme(); ["themeBtn","themeBtn2"].forEach(id=>{ const b=document.getElementById(id); b.textContent=t==="light"?"Dark":"Bright"; b.setAttribute("aria-label",t==="light"?"Switch to the dark theme":"Switch to the bright theme"); }); }
function setTheme(t){ document.documentElement.dataset.theme=t; try{localStorage.setItem(KEY+"-theme",t);}catch(e){} applyThemeLabels(); drawCharts(); }
try{ const t=localStorage.getItem(KEY+"-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
["themeBtn","themeBtn2"].forEach(id=>document.getElementById(id).addEventListener("click",()=>setTheme(currentTheme()==="light"?"dark":"light")));
applyThemeLabels();

function summaryText(){
  const m=S.m,p=m.params, ys=years(m);
  const L=[`DACS cost scenario ${ys[0]}-${ys[ys.length-1]}`,
   `Mix: Secretariat Level ${S.lv.sec+1}, Working Groups Level ${S.lv.wg+1}, Regional delivery Level ${S.lv.prod+1}`,
   `Annual direct cost: USD ${fmt(SC.annualTotal)}`,
   `  Secretariat: USD ${fmt(SC.annual.sec)} | Working Groups (${p.nWG}): USD ${fmt(SC.annual.wg)} | Regional delivery: USD ${fmt(SC.annual.prod)}`,
   `Decade total incl. PSC (${pct(p.psc)}): USD ${fmt(SC.dec.total)}`,
   `  Secretariat: USD ${fmt(SC.dec.sec)} (envelope USD ${fmt(SC.envelope)}, ${SC.dec.sec<=SC.envelope?"headroom":"gap"} USD ${fmt(Math.abs(SC.envelope-SC.dec.sec))})`,
   `  Working Groups: USD ${fmt(SC.dec.wg)}`,
   `  Regional delivery and products: USD ${fmt(SC.dec.prod)}`,
   `Share of USD ${fmt(p.target)} mobilisation target: ${pct(SC.dec.total/p.target)}`];
  if(p.basis==="max") L.push("Staff costed at maximum cost.");
  if(p.esc||p.ramp>1) L.push(`Exploration levers: escalation ${(p.esc*100).toFixed(1)}%/yr, ramp-up ${p.ramp} yr (not in the workbook).`);
  return L.join("\n");
}

let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(drawCharts,120); });
renderAll();
</script>
